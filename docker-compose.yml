services:
  web:
    image: ${IMAGE_URL:?set IMAGE_URL to the image to run}

    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}

    container_name: bentoai-web

    ports:
      - "127.0.0.1:3000:3000"
    restart: ${RESTART_POLICY:-unless-stopped}

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
